<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galho</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-view="list">
  <header class="topbar">
    <a href="#/" class="brand"><span class="logo"></span>Galho</a>
    <span id="title"></span>
    <span id="status"></span>
    <span class="history-btns">
      <button id="undo" class="icon" title="Desfazer (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button id="redo" class="icon" title="Refazer (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    </span>
  </header>

  <main id="list-view">
    <div class="list-head">
      <h1>Meus mapas</h1>
      <button id="new-map" class="primary">Novo mapa</button>
    </div>
    <ul id="maps"></ul>
    <p id="empty" hidden>Nenhum mapa ainda. Crie o primeiro.</p>
  </main>

  <section id="editor-view">
    <svg id="canvas">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22a559"/></marker>
        <marker id="arrow-sel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5bea"/></marker>
      </defs>
      <g id="viewport"></g>
    </svg>
    <input id="editor" hidden autocomplete="off" spellcheck="false">

    <!-- barra flutuante sobre o nó selecionado -->
    <div id="toolbar" class="card" hidden>
      <button id="style-btn" class="icon" title="Cor e forma"><svg viewBox="0 0 24 24"><path d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z"/></svg></button>
      <button id="link-btn" class="icon" title="Ligar a outro nó"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="m8 16 8-8" stroke-dasharray="2 3"/></svg></button>
      <button id="delete-btn" class="icon" title="Apagar (Del)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg></button>
      <button id="more-btn" class="icon" title="Mais opções"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    </div>
    <div id="node-menu" class="card menu" hidden>
      <button data-action="child">Novo filho <kbd>Tab</kbd></button>
      <button data-action="sibling">Novo irmão <kbd>Enter</kbd></button>
      <button data-action="collapse">Recolher / expandir <kbd>Espaço</kbd></button>
      <hr>
      <button data-action="link">Ligar a outro nó</button>
      <button data-action="copy">Copiar ramo <kbd>Ctrl+C</kbd></button>
      <button data-action="paste">Colar ramo <kbd>Ctrl+V</kbd></button>
      <hr>
      <button data-action="delete" class="danger">Apagar <kbd>Del</kbd></button>
    </div>
    <div id="style-pop" class="card" hidden>
      <div class="tabs">
        <button data-tab="shape" class="active">Forma</button>
        <button data-tab="border">Borda</button>
        <button data-tab="line">Linha</button>
      </div>
      <div data-panel="shape">
        <p>Cores do tema</p>
        <div class="swatches" data-prop="color" data-extra="auto none"></div>
        <p>Cores personalizadas</p>
        <div class="customs"><div class="swatches" data-prop="color" data-custom></div><button class="add-custom icon" data-prop="color" title="Escolher cor">+</button></div>
        <hr>
        <div class="seg shapes" data-prop="shape">
          <button data-value="underline" class="icon" title="Linha"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
          <button data-value="rect" class="icon" title="Retângulo"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12"/></svg></button>
          <button data-value="rounded" class="icon" title="Arredondado"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="4"/></svg></button>
          <button data-value="pill" class="icon" title="Elipse"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="5"/></svg></button>
          <button data-value="cloud" class="icon" title="Nuvem"><svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-8 5 5 0 0 1 9.7-1A4.5 4.5 0 0 1 17 18z"/></svg></button>
        </div>
        <label class="switch"><input type="checkbox" id="boundary"><span></span> Mostrar como contorno</label>
      </div>
      <div data-panel="border" hidden>
        <p>Cor da borda</p>
        <div class="swatches" data-prop="borderColor" data-extra="auto"></div>
        <div class="customs"><div class="swatches" data-prop="borderColor" data-custom></div><button class="add-custom icon" data-prop="borderColor" title="Escolher cor">+</button></div>
        <p>Espessura</p>
        <div class="seg" data-prop="borderWidth"><button data-value="thin">Fina</button><button data-value="medium">Média</button><button data-value="thick">Grossa</button></div>
        <p>Estilo</p>
        <div class="seg" data-prop="borderStyle"><button data-value="solid">Sólida</button><button data-value="dashed">Tracejada</button><button data-value="dotted">Pontilhada</button></div>
      </div>
      <div data-panel="line" hidden>
        <p>Cor da linha até o pai</p>
        <div class="swatches" data-prop="lineColor" data-extra="auto"></div>
        <div class="customs"><div class="swatches" data-prop="lineColor" data-custom></div><button class="add-custom icon" data-prop="lineColor" title="Escolher cor">+</button></div>
        <p>Espessura</p>
        <div class="seg" data-prop="lineWidth"><button data-value="thin">Fina</button><button data-value="medium">Média</button><button data-value="thick">Grossa</button></div>
        <p>Estilo</p>
        <div class="seg" data-prop="lineStyle"><button data-value="solid">Sólida</button><button data-value="dashed">Tracejada</button></div>
      </div>
      <input type="color" id="custom-color" hidden>
    </div>
    </div>

    <!-- botões "+" ao lado do nó selecionado -->
    <button id="add-child" class="adder" title="Novo filho (Tab)">+</button>
    <button id="add-sibling" class="adder" title="Novo irmão (Enter)">+</button>
    <!-- modo "Ligar": contorno verde e um "+" em cada lado do nó de origem -->
    <div id="link-ring" hidden></div>
    <button class="link-anchor" data-side="top" hidden title="Sair por cima">+</button>
    <button class="link-anchor" data-side="right" hidden title="Sair pela direita">+</button>
    <button class="link-anchor" data-side="bottom" hidden title="Sair por baixo">+</button>
    <button class="link-anchor" data-side="left" hidden title="Sair pela esquerda">+</button>
    <div id="hints"><span><kbd>Tab</kbd> filho</span><span><kbd>Enter</kbd> irmão</span></div>

    <div id="dock" class="card">
      <select id="layout-select" title="Layout">
        <option value="map">Mapa</option>
        <option value="org">Organograma</option>
        <option value="list">Lista</option>
      </select>
      <button id="zoom-out" class="icon" title="Diminuir zoom">−</button>
      <button id="zoom-reset" title="Zoom 100%">100%</button>
      <button id="zoom-in" class="icon" title="Aumentar zoom">+</button>
      <button id="zoom-fit" class="icon" title="Ajustar à tela"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
