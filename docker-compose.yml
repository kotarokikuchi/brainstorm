services:
  brainstorm:
    build: .
    image: brainstorm
    # your machine only (127.0.0.1): nobody on the network can reach it. The app speaks plain HTTP:
    # to use it from another machine, open an SSH tunnel; never change this to 0.0.0.0
    ports:
      - "127.0.0.1:8080:8000"
    # your maps, boards, attachments, history and trash stay in the ./data folder
    volumes:
      - ./data:/data
      # attachments on an external disk: uncomment and change the path
      # - /mnt/storage/brainstorm-attachments:/attachments
    # login: user and password come from the environment of whoever runs "docker compose"
    # (e.g. BRAINSTORM_USER=ana BRAINSTORM_PASSWORD=... docker compose up -d) or, if not set
    # there, from the .env file next to this one. Without both, the app opens with no login.
    environment:
      BRAINSTORM_USER: ${BRAINSTORM_USER:-}
      BRAINSTORM_PASSWORD: ${BRAINSTORM_PASSWORD:-}
      # without a login the app refuses to listen on 0.0.0.0; it is fine here, because the port is
      # only published on 127.0.0.1
      BRAINSTORM_ALLOW_NO_LOGIN: "1"
      # BRAINSTORM_FILES: /attachments
    # runs as your user, so the files in ./data are not owned by root
    user: "${UID:-1000}:${GID:-1000}"
    # the container only writes to /data (and to the attachments, if mounted) and runs unprivileged
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped
