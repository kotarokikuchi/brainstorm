services:
  brainstorm:
    build: .
    image: brainstorm
    # só na sua máquina (127.0.0.1): ninguém na rede acessa. O app fala HTTP puro: para usar de outra
    # máquina, túnel SSH ou proxy reverso com TLS; nunca troque para 0.0.0.0
    ports:
      - "127.0.0.1:8080:8000"
    # seus mapas, quadros, anexos, histórico e lixeira continuam na pasta ./data
    volumes:
      - ./data:/data
      # anexos num disco externo: descomente e troque o caminho
      # - /mnt/storage/brainstorm-anexos:/anexos
    # login: usuário e senha vêm das variáveis de ambiente de quem roda o "docker compose"
    # (ex.: BRAINSTORM_USER=ana BRAINSTORM_PASSWORD=... docker compose up -d) ou, se não estiverem
    # definidas, do arquivo .env ao lado deste. Sem as duas, o app abre sem login.
    environment:
      BRAINSTORM_USER: ${BRAINSTORM_USER:-}
      BRAINSTORM_PASSWORD: ${BRAINSTORM_PASSWORD:-}
      # BRAINSTORM_FILES: /anexos
    # roda com o seu usuário para os arquivos em ./data não ficarem como root
    user: "${UID:-1000}:${GID:-1000}"
    # o container só escreve em /data (e nos anexos, se montados) e roda sem privilégios
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped
